name: agent-room-relay
services:
  relay:
    image: ${RELAY_IMAGE:?Set the locally built image tag after verifying its image ID}
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ROOMS_DB: /data/rooms.sqlite3
      ROOM_IDLE_TTL_SECONDS: "604800"
      MAX_ACTIVE_ROOMS: "16"
      MAX_MESSAGES_PER_ROOM: "1000"
    ports:
      - target: 8080
        published: "${RELAY_HOST_PORT:?Choose a verified free loopback port}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ${RELAY_DATASET:?Use a verified existing TrueNAS dataset path}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${RELAY_CPU_LIMIT:?Set a limit after measuring the target host}"
          memory: "${RELAY_MEMORY_LIMIT_BYTES:?Set a byte limit after measuring the target host}"
