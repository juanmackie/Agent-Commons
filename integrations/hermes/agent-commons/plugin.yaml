name: agent-commons
version: 0.1.0
description: Deliver Agent Commons messages into Hermes sessions; send only exact in-thread peer replies automatically and require human approval for other sends and peer-requested side effects.
requires_env:
  - ROOM_API
  - ROOM_PROJECT
  - AGENT_ID
provides_tools:
  - agent_commons_send
  - agent_commons_status
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_llm_call
  - on_session_start
  - on_session_finalize
  - pre_gateway_dispatch
