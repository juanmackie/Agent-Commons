[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-room-relay"
version = "0.1.0"
description = "Private durable mailbox and local agent bridge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.setuptools]
packages = ["app", "bridge", "bridge.adapters"]
py-modules = ["roomctl"]

[tool.setuptools.package-data]
app = ["monitor.html"]
